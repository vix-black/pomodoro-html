<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 POMODORO</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111827;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    text-align: center;
    width: 420px;
}

h1 {
    margin-bottom: 20px;
}

.timer {
    font-size: 5rem;
    font-weight: bold;
    margin: 30px 0;
}

.status {
    color: #9ca3af;
    margin-bottom: 20px;
}

.presets {
    margin-bottom: 20px;
}

.presets button {
    background: #374151;
    color: white;
    margin: 4px;
}

button {
    padding: 12px 18px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    opacity: 0.9;
}

.start {
    background: #10b981;
    color: white;
}

.pause {
    background: #f59e0b;
    color: white;
}

.reset {
    background: #ef4444;
    color: white;
}

.stats {
    margin-top: 30px;
    color: #9ca3af;
}
</style>
</head>
<body>

<div class="container">

    <h1>🍅 POMODORO</h1>

    <div id="status" class="status">Select a Timer</div>

    <div id="timer" class="timer">05:00</div>

    <div class="presets">
        <button onclick="setTimer(5)">☕ Reset</button>
        <button onclick="setTimer(10)">⚡ Momentum</button>
        <button onclick="setTimer(15)">🎯 Quick Win</button>
        <button onclick="setTimer(30)">🚀 Deep Focus</button>
    </div>

    <div>
        <button class="start" onclick="startTimer()">Start</button>
        <button class="pause" onclick="pauseTimer()">Pause</button>
        <button class="reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="stats">
        Sessions Completed:
        <span id="sessions">0</span>
    </div>

</div>

<script>

let selectedMinutes = 5;
let timeLeft = selectedMinutes * 60;
let timer = null;
let running = false;

let sessions =
    Number(localStorage.getItem("focusSessions")) || 0;

document.getElementById("sessions").textContent = sessions;

function updateDisplay() {

    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;

    document.getElementById("timer").textContent =
        String(mins).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0");
}

function setTimer(minutes) {

    pauseTimer();

    selectedMinutes = minutes;
    timeLeft = minutes * 60;

    document.getElementById("status").textContent =
        minutes + " Minute Timer";

    updateDisplay();
}

function startTimer() {

    if (running) return;

    running = true;

    timer = setInterval(() => {

        timeLeft--;

        updateDisplay();

        if (timeLeft <= 0) {

            clearInterval(timer);

            running = false;

            sessions++;

            localStorage.setItem(
                "focusSessions",
                sessions
            );

            document.getElementById("sessions").textContent =
                sessions;

            alert("✅ Timer Complete!");

            resetTimer();
        }

    }, 1000);
}

function pauseTimer() {

    clearInterval(timer);

    running = false;
}

function resetTimer() {

    pauseTimer();

    timeLeft = selectedMinutes * 60;

    updateDisplay();
}

updateDisplay();

</script>

</body>
</html>
